<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türk Masalları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-title: 'Cormorant Garamond', serif;
      --font-body: 'Lora', serif;
      --gold-main: #dfa84a;
      --gold-bright: #f3c267;
      --gold-dark: #b8822d;
      
      --page-bg: #070d14;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(223, 168, 74, 0.28);
      --card-text: #141f2b;
      --card-muted: #536473;
      
      --deck-bg: rgba(9, 16, 24, 0.92);
      --deck-border: rgba(223, 168, 74, 0.38);
      --box-border: rgba(223, 168, 74, 0.35);
      --btn-bg: #132232;
      --btn-text: #f0f4f8;
      --btn-border: rgba(223, 168, 74, 0.4);
      --tezhip-gold: #c9933b;

      --box-bg: rgba(14, 20, 28, 0.85);
      --text-main: #eaf1f8;
      --text-muted: #9bb1c5;
    }

    body.dark-mode {
      --page-bg: #04080e;
      --card-bg: rgba(14, 23, 34, 0.96);
      --card-border: rgba(223, 168, 74, 0.38);
      --card-text: #eaf1f8;
      --card-muted: #9bb1c5;
      
      --deck-bg: rgba(7, 12, 18, 0.95);
      --deck-border: rgba(223, 168, 74, 0.45);
      --box-border: rgba(223, 168, 74, 0.45);
      --btn-bg: #0d1722;
      --btn-text: #f3f7fa;
      --btn-border: rgba(223, 168, 74, 0.5);
      --tezhip-gold: #e5b058;

      --box-bg: rgba(8, 12, 18, 0.9);
      --text-main: #f3f7fa;
      --text-muted: #8da1b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); font-size: 16px; background-color: var(--page-bg); color: var(--text-main); line-height: 1.7; overflow-x: hidden; }

    /* HERO SECTION */
    .hero-fullscreen {
      position: relative;
      height: 100vh;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background-image: 
        linear-gradient(180deg, rgba(7, 13, 20, 0.3) 0%, rgba(7, 13, 20, 0.7) 70%, var(--page-bg) 100%),
        url('gorseller/1 numaralı görsel..png');
      background-size: cover;
      background-position: center 25%;
      background-attachment: fixed;
      z-index: 1;
    }
    .hero-fullscreen h1 {
      font-family: var(--font-title);
      font-size: clamp(4rem, 10vw, 7.5rem);
      font-weight: 700;
      color: var(--gold-main);
      text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 30px rgba(223,168,74,0.4);
      margin-bottom: 1rem;
    }
    .hero-fullscreen p {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      max-width: 600px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    /* MAIN CONTENT AREA WITH ZEMIN BACKGROUND */
    .content-area {
      position: relative;
      z-index: 10;
      margin-top: -50px;
      padding: 4rem 1.5rem 6rem;
      background-image: 
        linear-gradient(180deg, var(--page-bg) 0%, rgba(7, 13, 20, 0.8) 15%, rgba(7, 13, 20, 0.8) 85%, var(--page-bg) 100%),
        url('gorseller/zemin .jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      border-top: 2px solid var(--gold-main);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    }
    
    .wrapper {
      max-width: 820px;
      margin: 0 auto;
    }

    /* CONTROLS DECK */
    .controls-deck {
      background: var(--deck-bg);
      border: 1px solid var(--deck-border);
      border-radius: 14px;
      padding: 0.9rem 1.3rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 1rem;
      z-index: 50;
    }

    .search-wrap { flex: 1 1 240px; }
    .search-wrap input {
      width: 100%;
      padding: 0.65rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      border: 1px solid var(--deck-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #f0f5fa;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--gold-main); }
    
    .btn-actions { display: flex; gap: 0.65rem; align-items: center; }
    .ctrl-btn {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 0.52rem 1.2rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 8px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: var(--gold-main); color: #070d14; border-color: var(--gold-bright); }
    .btn-select { background: rgba(223, 168, 74, 0.16); color: var(--gold-bright); border-color: var(--gold-main); }
    .btn-select:hover { background: var(--gold-main); color: #070d14; }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--btn-border);
      color: var(--gold-bright);
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      background: var(--btn-bg);
    }
    .theme-btn:hover { background: var(--gold-main); color: #070d14; }
    .theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* COMPACT FAIRY TALE CARDS (Vertical Stack) */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }

    .tale-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.38);
      color: var(--card-text);
      overflow: hidden;
      position: relative;
    }

    .tale-summary-box {
      padding: 1.25rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.2rem;
      min-height: 98px;
      border-bottom: 1px solid transparent;
      cursor: pointer;
    }
    .tale-card.active .tale-summary-box { border-bottom-color: rgba(0, 0, 0, 0.08); }
    body.dark-mode .tale-card.active .tale-summary-box { border-bottom-color: rgba(255, 255, 255, 0.08); }

    .summary-text-group { flex: 1; min-width: 0; }
    .tale-title {
      font-family: var(--font-title);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--card-text);
      margin-bottom: 0.25rem;
    }
    body.dark-mode .tale-title { color: var(--gold-bright); }
    
    .tale-excerpt {
      font-family: var(--font-body);
      font-size: 0.94rem;
      color: var(--card-muted);
      line-height: 1.55;
    }

    .btn-read-toggle {
      font-family: var(--font-title);
      font-size: 1.02rem;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      border-radius: 22px;
      border: 1px solid var(--gold-main);
      background: transparent;
      color: var(--gold-dark);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    body.dark-mode .btn-read-toggle { color: var(--gold-bright); }
    .btn-read-toggle:hover { background: var(--gold-main); color: #070d14; }

    /* READING VIEWPORT INSIDE CARD */
    .reading-viewport {
      display: none;
      position: relative;
      padding: 2rem 2.2rem;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }
    .tale-card.active .reading-viewport {
      display: block;
      animation: fadeInStory 0.35s ease-in;
    }
    @keyframes fadeInStory { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* Tezhip Accents */
    .tezhip-frame { position: absolute; inset: 8px; pointer-events: none; border: 1px solid rgba(223, 168, 74, 0.22); border-radius: 8px; }
    .tezhip-corner { position: absolute; width: 30px; height: 30px; color: var(--tezhip-gold); opacity: 0.75; }
    .tezhip-tl { top: -1px; left: -1px; }
    .tezhip-tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .tezhip-bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .tezhip-br { bottom: -1px; right: -1px; transform: scale(-1); }

    /* Harmonious Backgrounds */
    .tale-card[data-id="1"] .reading-viewport { background-color: #fbf5ea; color: #2b1f11; }
    body.dark-mode .tale-card[data-id="1"] .reading-viewport { background-color: #1a150e; color: #ecd9c0; }
    .tale-card[data-id="2"] .reading-viewport { background-color: #f1f6f2; color: #17261a; }
    body.dark-mode .tale-card[data-id="2"] .reading-viewport { background-color: #0d1810; color: #cee2d2; }
    .tale-card[data-id="3"] .reading-viewport { background-color: #f0f4f9; color: #122133; }
    body.dark-mode .tale-card[data-id="3"] .reading-viewport { background-color: #0e1724; color: #d1dfed; }
    .tale-card[data-id="4"] .reading-viewport { background-color: #fbf1f2; color: #2c161a; }
    body.dark-mode .tale-card[data-id="4"] .reading-viewport { background-color: #1c0e12; color: #ebd0d5; }
    .tale-card[data-id="5"] .reading-viewport { background-color: #faf6ee; color: #262115; }
    body.dark-mode .tale-card[data-id="5"] .reading-viewport { background-color: #18150d; color: #ded6bf; }
    .tale-card[data-id="6"] .reading-viewport { background-color: #f3f4f6; color: #1c2229; }
    body.dark-mode .tale-card[data-id="6"] .reading-viewport { background-color: #11151b; color: #d0d7e0; }
    .tale-card[data-id="7"] .reading-viewport { background-color: #fbf2ef; color: #2e1610; }
    body.dark-mode .tale-card[data-id="7"] .reading-viewport { background-color: #1c100c; color: #ebd1c8; }
    .tale-card[data-id="8"] .reading-viewport { background-color: #eff7f5; color: #102621; }
    body.dark-mode .tale-card[data-id="8"] .reading-viewport { background-color: #0b1815; color: #c5e5de; }
    .tale-card[data-id="9"] .reading-viewport { background-color: #f2f3f9; color: #181c2f; }
    body.dark-mode .tale-card[data-id="9"] .reading-viewport { background-color: #101222; color: #d5d8ec; }

    .reading-content-scroll { max-height: 560px; overflow-y: auto; padding-right: 1.2rem; scrollbar-width: thin; scrollbar-color: var(--gold-main) transparent; position: relative; z-index: 2; }
    .reading-content-scroll::-webkit-scrollbar { width: 7px; }
    .reading-content-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
    .reading-content-scroll::-webkit-scrollbar-thumb { background: var(--gold-main); border-radius: 4px; }

    .story-hero-art { width: 100%; margin: 0.6rem 0 1.6rem; border-radius: 10px; overflow: hidden; border: 1px solid rgba(223, 168, 74, 0.35); box-shadow: 0 8px 22px rgba(0,0,0,0.16); background-color: #09121a; }
    .story-hero-art img { width: 100%; height: auto; max-height: 380px; object-fit: contain; display: block; }
    .reading-text { font-family: var(--font-body); font-size: 1.05rem; line-height: 1.9; text-align: justify; white-space: pre-line; }
    .reading-source-badge { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px dashed rgba(223, 168, 74, 0.4); font-family: var(--font-body); font-size: 0.88rem; font-style: italic; opacity: 0.88; }
    
    .empty-search { text-align: center; padding: 3.5rem 1rem; background: var(--card-bg); border: 1px dashed var(--card-border); border-radius: 12px; color: var(--card-muted); font-family: var(--font-title); font-size: 1.45rem; }

    
    /* FEEDBACK SECTION (Derste öğrenilen kodların entegrasyonu) */
    .feedback-box {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      text-align: center;
    }
    .feedback-box h2 {
      font-family: var(--font-title);
      color: var(--gold-main);
      font-size: 1.6rem;
      margin-bottom: 1rem;
    }
    
    .feedback-form {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .feedback-form input {
      flex: 1;
      min-width: 200px;
    }

    .feedback-form input {
      padding: 0.6rem 1rem;
      font-family: var(--font-body);
      border: 1px solid var(--deck-border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #f0f5fa;
      outline: none;
      margin-right: 0.5rem;
      width: 200px;
    }
    .feedback-form input:focus { border-color: var(--gold-main); }
    #feedbackResult {
      margin-top: 1rem;
      font-family: var(--font-title);
      font-size: 1.2rem;
      color: var(--gold-bright);
    }
    .footer-btn {
      background: transparent; border: 1px solid var(--gold-main); color: var(--gold-bright);
      padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-family: var(--font-body);
      margin-top: 1rem;
    }
    .footer-btn:hover { background: var(--gold-main); color: #000; }

    /* COMPACT BIBLIOGRAPHY BOX */
    .bib-box {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      margin-top: 4rem;
    }
    .bib-box h2 {
      font-family: var(--font-title);
      color: var(--gold-main);
      font-size: 1.8rem;
      border-bottom: 1px dashed var(--box-border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .bib-list {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .bib-item {
      padding: 0.8rem;
      background: rgba(0,0,0,0.2);
      border-left: 2px solid var(--gold-main);
      border-radius: 0 6px 6px 0;
    }
    .bib-item strong { color: var(--gold-bright); font-family: var(--font-title); font-size: 1.1rem; display: block; margin-bottom: 3px;}

    footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem; }
    
    @media(max-width: 768px) {
      .controls-deck { flex-direction: column; align-items: stretch; padding: 0.8rem; }
      .search-wrap { flex: none; width: 100%; }
      .btn-actions { justify-content: space-between; }
      .tale-summary-box { flex-direction: column; align-items: flex-start; padding: 1.1rem; }
      .btn-read-toggle { width: 100%; text-align: center; margin-top: 0.5rem; }
      .bib-list { grid-template-columns: 1fr; }
    }
  
    /* YILDIZ İMLEÇ (CURSOR) AYARI */
    html, body {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23f3c267" stroke="%23b8822d" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 12 12, auto;
    }
    
    /* Butonlara ve tıklanabilir alanlara gelince biraz daha parlayan bir yıldız olsun */
    button, .tale-summary-box, input {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="%23dfa84a" stroke="%23ffffff" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') 13 13, pointer !important;
    }

  
    /* SES KONTROL BUTONU */
    .audio-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--gold-bright);
      width: 42px; height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
    }
    .audio-btn:hover { background: var(--gold-main); color: #070d14; }
    .audio-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

  </style>
</head>
<body>

  <header class="hero-fullscreen">
    <h1>Türk Masalları</h1>
    <p>Geleneksel sözlü anlatı mirasımızın kaynak metinlerle derlenmiş seçkin masal külliyatı.</p>
  </header>

  <main class="content-area">
    <div class="wrapper">
      
      <!-- CONTROLS DECK -->
      <nav class="controls-deck">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Masal başlığında ara..." onkeyup="searchByTitle()">
        </div>
        <div class="btn-actions">
          <button class="ctrl-btn btn-select" onclick="chooseRandomTale()">Masal Seç</button>
          <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()" title="Müziği Aç / Kapat">
            <svg id="audioIcon" viewBox="0 0 24 24">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <button class="theme-btn" id="nightModeBtn" onclick="toggleTheme()" title="Gece / Gündüz Modu">
            <svg id="themeIcon" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </nav>

      <!-- TALES CARDS (Vertical Stack) -->
      <div class="cards-container" id="cardsContainer">
        <!-- Cards injected here -->
      </div>

      <!-- COMPACT BIBLIOGRAPHY BOX -->
      <section class="bib-box">
        <h2>Kaynakça</h2>
        <div class="bib-list" id="bibList">
          <!-- Bibliography text injected here -->
        </div>
      </section>

      <!-- OKUR DEFTERİ (Derste öğrenilen Input/Alert/TextContent mantığı) -->
      <section class="feedback-box">
        <h2>Okur Defteri</h2>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;">Masal diyarımıza adınızı bırakın.</p>
        <div class="feedback-form">
          <input type="text" id="visitorName" placeholder="Adınızı giriniz...">
          <button class="ctrl-btn" id="btnFeedback">Kaydet</button>
        </div>
        <p id="feedbackResult"></p>
      </section>

    </div>
  </main>

  <footer>
    <p>Türk Masalları Derlemesi — Geleneksel Sözlü Edebiyat Araştırma Portalı</p>
    <br>
    <button class="footer-btn" id="btnRepo">GitHub Deposuna Git</button>

  </footer>

  <script>
    const tezhipSVG = `
      <svg class="tezhip-corner tezhip-tl" viewBox="0 0 40 40" fill="currentColor">
        <path d="M2,2 L18,2 C18,7 15,12 12,15 C9,18 4,18 2,18 Z" opacity="0.4"/>
        <path d="M2,2 L2,24 C5,21 8,16 11,13 C14,10 19,8 24,2 Z" opacity="0.6"/>
        <path d="M2,2 L32,2 C28,6 20,8 16,12 C12,16 8,24 2,32 Z"/>
        <circle cx="8" cy="8" r="2.5"/>
      </svg>
      <svg class="tezhip-corner tezhip-tr" viewBox="0 0 40 40" fill="currentColor">
        <path d="M2,2 L18,2 C18,7 15,12 12,15 C9,18 4,18 2,18 Z" opacity="0.4"/>
        <path d="M2,2 L2,24 C5,21 8,16 11,13 C14,10 19,8 24,2 Z" opacity="0.6"/>
        <path d="M2,2 L32,2 C28,6 20,8 16,12 C12,16 8,24 2,32 Z"/>
        <circle cx="8" cy="8" r="2.5"/>
      </svg>
      <svg class="tezhip-corner tezhip-bl" viewBox="0 0 40 40" fill="currentColor">
        <path d="M2,2 L18,2 C18,7 15,12 12,15 C9,18 4,18 2,18 Z" opacity="0.4"/>
        <path d="M2,2 L2,24 C5,21 8,16 11,13 C14,10 19,8 24,2 Z" opacity="0.6"/>
        <path d="M2,2 L32,2 C28,6 20,8 16,12 C12,16 8,24 2,32 Z"/>
        <circle cx="8" cy="8" r="2.5"/>
      </svg>
      <svg class="tezhip-corner tezhip-br" viewBox="0 0 40 40" fill="currentColor">
        <path d="M2,2 L18,2 C18,7 15,12 12,15 C9,18 4,18 2,18 Z" opacity="0.4"/>
        <path d="M2,2 L2,24 C5,21 8,16 11,13 C14,10 19,8 24,2 Z" opacity="0.6"/>
        <path d="M2,2 L32,2 C28,6 20,8 16,12 C12,16 8,24 2,32 Z"/>
        <circle cx="8" cy="8" r="2.5"/>
      </svg>
    `;

    const tales = [
      {
        id: 1,
        title: "İnatçı Horoz",

    function buildReadingHTML(tale) {
      return `
        <div class="tezhip-frame">
          ${tezhipSVG}
        </div>
        <div class="reading-content-scroll">
          <div class="story-hero-art">
            <img src="gorseller/${tale.imageClean}" alt="${tale.title} İllüstrasyonu" loading="lazy">
          </div>
          <div class="reading-text">${tale.fullStory}</div>
          <div class="reading-source-badge">
            <strong>Kaynak:</strong> ${tale.source}
          </div>
        </div>
      `;
    }

    function renderTales(list) {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-search">Aradığınız başlığa uygun masal bulunamadı.</div>';
        return;
      }

      list.forEach(tale => {
        const card = document.createElement('article');
        card.className = 'tale-card';
        card.setAttribute('data-id', tale.id);
        card.id = 'tale-card-' + tale.id;

        card.innerHTML = `
          <div class="tale-summary-box" onclick="toggleTaleReading(${tale.id})">
            <div class="summary-text-group">
              <h2 class="tale-title">${tale.title}</h2>
              <p class="tale-excerpt">${tale.excerpt}</p>
            </div>
            <button class="btn-read-toggle" id="btn-read-${tale.id}">Masalı Oku</button>
          </div>
          <div class="reading-viewport" id="reading-body-${tale.id}">
            ${buildReadingHTML(tale)}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleTaleReading(id) {
      const card = document.getElementById('tale-card-' + id);
      const btn = document.getElementById('btn-read-' + id);
      const isActive = card.classList.contains('active');

      if (isActive) {
        card.classList.remove('active');
        btn.textContent = 'Masalı Oku';
      } else {
        card.classList.add('active');
        btn.textContent = 'Kapat';
      }
    }

    function renderBib() {
      const container = document.getElementById('bibList');
      bibliography.forEach(b => {
        container.innerHTML += `
          <div class="bib-item">
            <strong>${b.story}</strong>
            Yazar/Derleyen: ${b.author}<br>
            Eser: <em>${b.book}</em><br>
            Yayınevi: ${b.publisher}, ${b.year}
          </div>
        `;
      });
    }

    function normalizeTr(str) {
      if (!str) return '';
      return str.replace(/İ/g, 'i').replace(/I/g, 'ı').toLocaleLowerCase('tr-TR').trim();
    }

    function searchByTitle() {
      const rawInput = document.getElementById('searchInput').value;
      const normalizedQuery = normalizeTr(rawInput);
      const filtered = tales.filter(t => normalizeTr(t.title).includes(normalizedQuery));
      renderTales(filtered);
    }

    function chooseRandomTale() {
      document.getElementById('searchInput').value = '';
      renderTales(tales);

      document.querySelectorAll('.tale-card').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.btn-read-toggle').forEach(b => b.textContent = 'Masalı Oku');

      const randomTale = tales[Math.floor(Math.random() * tales.length)];
      const targetCard = document.getElementById('tale-card-' + randomTale.id);
      const targetBtn = document.getElementById('btn-read-' + randomTale.id);

      if (targetCard) {
        targetCard.classList.add('active');
        targetBtn.textContent = 'Kapat';
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      const icon = document.getElementById('themeIcon');
      if (isDark) {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      } else {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
    }

    renderTales(tales);
    
    // ARKA PLAN SESİ KONTROLÜ
    let isPlaying = false;
    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      const icon = document.getElementById('audioIcon');
      
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
        }).catch(e => {
          alert("Ses dosyası oynatılamadı. Lütfen 'gorseller' klasöründe 'arka plan ses.mp3' dosyasının olduğundan emin olun.");
        });
      }
    }

    renderBib();

    // DERSTE ÖĞRENİLEN KODLARIN ENTEGRASYONU
    
    // 1. Input kontrolü, Alert ve TextContent kullanımı (Ekran Resmi 2026-10-07)
    document.getElementById("btnFeedback").addEventListener("click", function() {
      const ad = document.getElementById("visitorName").value;
      
      if (ad === "") {
        alert("Lütfen adınızı yazınız!");
        return;
      }
      
      document.getElementById("feedbackResult").textContent = "Teşekkürler " + ad + ", masal diyarımıza hoş geldin!";
      document.getElementById("visitorName").value = ""; // Kutuyu temizle
    });

    // 2. Yeni sayfa açma mantığı (Ekran Resmi 2026-09-30)
    // Ödevde HTML tek sayfa olması gerektiği için hakkinda.html yerine GitHub linki açtırıyoruz.
    document.getElementById("btnRepo").addEventListener("click", function() {
      window.open("https://github.com", "_blank");
    });

  </script>
